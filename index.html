<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mey | Personal Portfolio</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  /* color palette — might tweak the accent later, still deciding */
  :root{
    --bg:#0e0f12;
    --bg-soft:#15171c;
    --card:#1a1d24;
    --accent:#ffb347;
    --accent-2:#7cf2c4;
    --border:#2a2e37;
  }
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:#eef0f3;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  .section-muted{color:#9aa0ab;}
  .section-label{color:var(--accent);text-transform:uppercase;letter-spacing:3px;font-size:.8rem;font-weight:600;}
  section{padding:100px 0;scroll-margin-top:80px;}
  .bg-panel{background:var(--bg-soft);}
  .navbar-dark-custom{background:rgba(14,15,18,0.95);border-bottom:1px solid var(--border);}
  .navbar-brand-custom{font-weight:700;letter-spacing:1px;}
  .navbar-brand-custom span{color:var(--accent);}
  footer{border-top:1px solid var(--border);}
  .navbar-toggler{border-color:var(--border);}
  .navbar-toggler-icon{filter:invert(1) grayscale(1) brightness(2);}

  /* no JS allowed for this one, so a hidden checkbox does the hamburger toggle instead */
  .nav-toggle-check{display:none;}
  .nav-toggle-label{cursor:pointer;}
  .navbar-collapse-custom{display:flex;flex-grow:1;align-items:center;}
  @media (max-width:991.98px){
    .navbar-collapse-custom{display:none;width:100%;padding-top:14px;}
    .nav-toggle-check:checked ~ .navbar-collapse-custom{display:block;}
    .navbar-collapse-custom .navbar-nav{flex-direction:column;}
  }
</style>
</head>
<body>

<!-- navbar, sticky at top -->
<header>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-dark-custom fixed-top py-3">
    <div class="container">
      <a class="navbar-brand navbar-brand-custom" href="#home">Mey<span>.</span></a>
      <!-- checkbox hack for the mobile menu since we're not using bootstrap's JS -->
      <input type="checkbox" id="navToggle" class="nav-toggle-check">
      <label for="navToggle" class="navbar-toggler nav-toggle-label" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </label>
      <div class="navbar-collapse-custom" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#skills">Skills</a></li>
          <li class="nav-item"><a class="nav-link" href="#gallery">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="#resume">Resume</a></li>
          <li class="nav-item"><a class="nav-link" href="#projects">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<main>

<!-- HOME -->
<!-- just the section shells for now, filling these in next commit -->
<section id="home">
  <div class="container">
    <h1>Hi, I'm Mey.</h1>
  </div>
</section>

<!-- ABOUT -->
<section id="about" class="bg-panel">
  <div class="container">
    <h2>About Me</h2>
  </div>
</section>

<!-- SKILLS -->
<section id="skills">
  <div class="container">
    <h2>Skills &amp; Tools</h2>
  </div>
</section>

<!-- GALLERY -->
<section id="gallery" class="bg-panel">
  <div class="container">
    <h2>Gallery</h2>
  </div>
</section>

<!-- RESUME -->
<section id="resume">
  <div class="container">
    <h2>Resume</h2>
  </div>
</section>

<!-- PROJECTS -->
<section id="projects" class="bg-panel">
  <div class="container">
    <h2>Projects &amp; Accomplishments</h2>
  </div>
</section>

<!-- CONTACT -->
<section id="contact">
  <div class="container">
    <h2>Get In Touch</h2>
  </div>
</section>

</main>

<footer class="text-center py-4 section-muted small">
  <div class="container">&copy; 2026 Dela Cruz. All rights reserved.</div>
</footer>

</body>
</html>
